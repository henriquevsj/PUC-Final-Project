# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:DesktopBuildPackageLocation="$(build.artifactStagingDirectory)\WebApp.zip" /p:DeployIisAppPath="Default Web Site"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- bash: |
    RESPONSE=$(curl -s -X POST "https://security-gate.sec.turing.seg.br/scan" \
      -H "X-Security-Gate-Token: $(SECURITY_GATE_TOKEN)" \
      -H "Content-Type: application/json" \
      -d "{
        \"repo_url\": \"$(Build.Repository.Uri)\",
        \"branch\": \"$(Build.SourceBranchName)\",
        \"trigger\": \"$(Build.Reason)\"
      }")

    STATUS=$(echo "$RESPONSE" | jq -r '.status // "fail"')
    echo "$RESPONSE" | jq -r '.sarif // "{}"' > turing-results.sarif

    echo "### Vulnerabilidades Encontradas ###"
    echo "$RESPONSE" | jq -r '.findings[] | "- [" + .severity + "] " + .title + " (" + .file + ":" + (.line|tostring) + ")"' \
      || echo "Nenhuma vulnerabilidade listada."

    if [ "$STATUS" = "fail" ]; then
      echo "##vso[task.logissue type=error]BLOQUEADO: Vulnerabilidades críticas encontradas!"
      exit 1
    fi
  displayName: 'Turing Security Gate'
  env:
    SECURITY_GATE_TOKEN: $(SECURITY_GATE_TOKEN)

- publish: turing-results.sarif
  artifact: turing-results
  condition: always()